<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;background:#f5f3ed;color:#2c3930;font-family:Arial,sans-serif;line-height:1.7;padding:32px 16px">
  <main style="max-width:480px;margin:auto;background:white;border:1px solid #dedfd5;border-radius:20px;padding:28px">
    <p style="color:#636e60;font-size:14px">বাড়ির খাতা</p>
    <h1 style="font-size:24px;line-height:1.4">নিজের খাতা খুলুন</h1>
    <p>অ্যাকাউন্ট খোলার কাজ শেষ করতে আপনার ইমেইলটি নিশ্চিত করুন।</p>
    <p style="margin:28px 0"><a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:13px 22px;border-radius:12px;background:#3f4f44;color:white;text-decoration:none;font-weight:bold">ইমেইল নিশ্চিত করি</a></p>
    <p style="color:#636e60;font-size:13px">লিংকটি ১ ঘণ্টা কাজ করবে। আপনি অ্যাকাউন্ট খুলতে না চাইলে এই ইমেইলটি এড়িয়ে যেতে পারেন।</p>
  </main>
</body>
</html>
